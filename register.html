<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todozed - Inscription</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <div id="register">
        <div class="container">

            <div class="title">
                <h1>Créez votre compte sur <span>Todozed</span></h1>
            </div>

            <div class="content">
                <p>Veuillez vous inscrire pour créer un compte.</p>
                <form>
                    <div class="control-form">
                        <label for="username">E-mail:</label>
                        <input type="email" id="username" name="email" required>
                    </div>
                    <div class="control-form">
                        <label for="password">Mot de passe:</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <div class="control-form">
                        <label for="confirm-password">Confirmez votre mot de passe:</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                    </div>
                    
                    <button type="submit">S'inscrire</button>
                </form>
            </div>

            <div class="footer">
                <p>Déjà un compte? <a href="./index.html">Connectez-vous ici</a>.</p>
            </div>

        </div>
    </div>

    <script type="module" src="./assets/js/auth.js"></script>
    
</body>
</html>
