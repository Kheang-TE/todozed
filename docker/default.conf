# =============================================================================
# nginx - Frontend statique + reverse proxy vers l'API
# -----------------------------------------------------------------------------
# Même origine : le navigateur charge la page depuis ce serveur, et les appels
# fetch('/api/...') sont relayés en interne vers le conteneur du back-end.
# Avantage : le cookie JWT (BEARER) reste SameSite=Lax, pas de CORS cross-origin.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Fichiers statiques servis directement.
    # "try_files ... /index.html" = fallback type SPA (ici pas de routes client,
    # mais cela permet d'atteindre proprement les pages .html sans extension).
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cette configuration est générée au démarrage : ne pas la conserver en
    # cache après un changement de variable Docker.
    location = /assets/js/config.js {
        add_header Cache-Control "no-store" always;
    }

    location = /assets/css/style.css {
        add_header Cache-Control "no-store" always;
    }

    # -------------------------------------------------------------------------
    # Reverse proxy vers le service du back-end. API_HOST doit être son nom DNS
    # Docker et API_PORT son port d'écoute interne (pas le port publié sur l'hôte).
    # Le préfixe /api/ est conservé tel quel : le backend attend /api/register,
    # /api/login, /api/tasks, etc.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://${API_HOST}:${API_PORT};

        # En-têtes indispensables pour un reverse proxy correct
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts généreux (migrations/appels lents occasionnels)
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    # -------------------------------------------------------------------------
    # Cacher/courtes durées de cache pour les assets statiques (css/js)
    # -------------------------------------------------------------------------
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}