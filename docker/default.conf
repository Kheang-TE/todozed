# =============================================================================
# nginx - Frontend statique + reverse proxy vers l'API
# -----------------------------------------------------------------------------
# Même origine : le navigateur charge la page depuis ce serveur, et les appels
# fetch('/api/...') sont routés en interne vers le conteneur backend "api".
# Avantage : le cookie JWT (BEARER) reste SameSite=Lax, pas de CORS cross-origin.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------------------------
    # Fichiers statiques servis directement.
    # "try_files ... /index.html" = fallback type SPA (ici pas de routes client,
    # mais cela permet d'atteindre proprement les pages .html sans extension).
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Reverse proxy vers l'API Symfony (conteneur "api", résolu par DNS interne
    # du réseau Docker).
    # Le préfixe /api/ est conservé tel quel : le backend attend /api/register,
    # /api/login, /api/tasks, etc.
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:80;

        # En-têtes indispensables pour un reverse proxy correct
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts généreux (migrations/appels lents occasionnels)
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    # -------------------------------------------------------------------------
    # Cacher/courtes durées de cache pour les assets statiques (css/js)
    # -------------------------------------------------------------------------
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}