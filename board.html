<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Todozed - Tableau de bord</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
        <link rel="stylesheet" href="./assets/css/style.css">
    </head>
    <body>
        <div id="board">
            <header>
                <h1>Todo<span>zed</span></h1>
                <div class="profile">
                    <div class="username"><i class="fas fa-user"></i><span></span></div>
                    <button type="button" id="logout-button"><i class="fas fa-sign-out-alt"></i>Se déconnecter</button>
                </div>
            </header>

            <main class="container">

                <div id="todo-search">
                    <label for="search-input">Rechercher : </label>
                    <div id="todo-search-container">
                        <i class="fas fa-search"></i>
                        <input type="text" id="search-input" placeholder="Rechercher une tâche...">
                    </div>
                </div>
                <div id="todo-actions">
                    <div id="todo-actions-filters">
                        <span>Filtres : </span>
                        <div class="filters">
                            <button type="button" class="filter-button" data-filter="all">Tous</button>
                            <button type="button" class="filter-button" data-filter="todo">À faire</button>
                            <button type="button" class="filter-button" data-filter="doing">En cours</button>
                            <button type="button" class="filter-button" data-filter="done">Terminées</button>
                        </div>
                    </div>
                    <div id="todo-actions-sort">
                        <span>Trier par : </span>
                        <select class="sort">
                            <option value="date-desc">Date décroissante</option>
                            <option value="date-asc">Date croissante</option>
                            <option value="title-asc">Titre A-Z</option>
                            <option value="title-desc">Titre Z-A</option>
                        </select>
                    </div>
                </div>
                
                <div id="todo">
                    <header id="todo-header">
                        <h2>Tâches</h2>
                        <button type="button" id="add-task-button"><i class="fas fa-plus"></i></button>
                    </header>

                    <div id="todo-content">
                        <ul id="task-list"></ul>
                    </div>

                </div>                

            </main>

        </div>
        
        <!-- Modal -->
        <div id="background-modal"></div>
        <div class="modal"></div>
        <!-- End of Modal -->

        <!-- Template Modal - Add task -->
        <template id="add-task-modal-template">
            <div class="modal-container">
                <div class="modal-header">
                    <h2>Ajouter une tâche</h2>
                    <button type="button" class="close-modal-button"><i class="fas fa-times"></i></button>
                </div>
                <div class="modal-body">
                    <form id="add-task-form">
                        <input type="text" id="task-input" placeholder="Saisissez votre tâche..." required>
                        <button type="submit">Ajouter</button>
                    </form>
                </div>
            </div>
        </template>
        <!-- End of Template Modal - Add task -->

        <!-- Modal - Edit task -->
        <template id="edit-task-modal-template">
            <div class="modal-container">
                <div class="modal-header">
                    <h2>Modifier la tâche</h2>
                    <button type="button" class="close-modal-button"><i class="fas fa-times"></i></button>
                </div>
                <div class="modal-body">
                    <form id="edit-task-form">
                        <input type="text" id="edit-task-input" required>
                        <select id="edit-task-status">
                            <option value="todo">À faire</option>
                            <option value="doing">En cours</option>
                            <option value="done">Terminée</option>
                        </select>
                        <button type="submit">Enregistrer</button>
                    </form>
                </div>
            </div>
        </template>
        <!-- End of Template Modal - Edit task -->

        <!-- Modal - Delete task -->
        <template id="delete-task-modal-template">
            <div class="modal-container">
                <div class="modal-header">
                    <h2>Supprimer la tâche</h2>
                    <button type="button" class="close-modal-button"><i class="fas fa-times"></i></button>
                </div>
                <div class="modal-body">
                    <p>Êtes-vous sûr de vouloir supprimer cette tâche ?</p>
                    <button id="confirm-delete-button">Oui, supprimer</button>
                    <button id="cancel-delete-button" class="close-modal-button">Non, annuler</button>
                </div>
            </div>
        </template>
        <!-- End of Template Modal - Delete task -->

        <!-- Template task item -->
        <template id="task-item-template">
            <li class="task-item">
                <label></label>
                <span class="status"></span>
                <button type="button" class="edit-task-button"><i class="fas fa-edit"></i></button>
                <button type="button" class="delete-task-button"><i class="fas fa-trash"></i></button>
            </li>
        </template>
        <!-- End of Template task item -->

        <script src="./assets/js/auth.js"></script>
        <script src="./assets/js/task.js"></script>
        
    </body>
</html>
